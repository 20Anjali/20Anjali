<svg width="100%" height="290" viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace">
  <rect x="0.5" y="0.5" width="899" height="289" rx="10" fill="#0d0620" stroke="#9d5cff" stroke-opacity="0.25"/>

  <text x="24" y="34" font-size="12" fill="#37d4e0" fill-opacity="0.8">// stack.md</text>
  <line x1="24" y1="46" x2="876" y2="46" stroke="#9d5cff" stroke-opacity="0.15"/>

  <!-- column headers -->
