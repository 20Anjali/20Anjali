    <text x="24" y="142">Python</text>
    <text x="24" y="164">Embedded C</text>
    <text x="24" y="186">Linux Shell</text>
  </g>

  <!-- column 2: MCUs -->
  <g font-size="13.5" fill="#e7e2f5">
    <text x="252" y="98">ESP32</text>
