  <text x="252" y="72" font-size="12" fill="#9d5cff" fill-opacity="0.9">MICROCONTROLLERS</text>
  <text x="480" y="72" font-size="12" fill="#9d5cff" fill-opacity="0.9">PROTOCOLS</text>
  <text x="708" y="72" font-size="12" fill="#9d5cff" fill-opacity="0.9">TOOLING</text>

  <!-- column 1: languages -->
