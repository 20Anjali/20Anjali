    <rect x="242" y="92" width="4" height="4"/>
    <rect x="470" y="92" width="4" height="4"/>
    <rect x="698" y="92" width="4" height="4"/>
    <rect x="14" y="136" width="4" height="4"/>
    <rect x="242" y="136" width="4" height="4"/>
    <rect x="470" y="136" width="4" height="4"/>
    <rect x="698" y="136" width="4" height="4"/>
    <rect x="14" y="180" width="4" height="4"/>
    <rect x="242" y="180" width="4" height="4"/>
    <rect x="470" y="180" width="4" height="4"/>
